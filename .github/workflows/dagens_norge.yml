name: Dagens Norge – Daily News Digest

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Oslo (CET) / 08:00 Oslo (CEST in summer)
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip
